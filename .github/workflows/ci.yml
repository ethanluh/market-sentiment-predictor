name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: black
        run: black --check src tests scripts

      - name: isort
        run: isort --check-only src tests scripts

      - name: mypy
        run: mypy src

      - name: pytest
        run: pytest tests -q --cov

  # Builds the serving image so Dockerfile or requirements.txt breakage fails a PR.
  # Build only: the app fails fast without MODEL_PATH, so there is no /health smoke
  # test until a model artifact can be produced in CI.
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build serving image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
